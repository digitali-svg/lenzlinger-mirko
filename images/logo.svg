<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" role="img" aria-label="Lenzlinger — Etiquettes – Etiketten">
  <!-- drop-shadow plate, same layered look as the original mark -->
  <rect x="16" y="78" width="432" height="178" fill="#9a9a9a"/>

  <!-- CMYK swatches -->
  <g>
    <rect x="236" y="8"  width="46" height="46" fill="#00AEEF"/>
    <rect x="292" y="8"  width="46" height="46" fill="#EC008C"/>
    <rect x="348" y="8"  width="46" height="46" fill="#FFF200"/>
    <rect x="404" y="8"  width="46" height="46" fill="#111111"/>
  </g>

  <!-- purple ribbon: curls up at the top-left, then runs as the box border -->
  <path id="lz-ribbon"
        d="M42,100
           C42,56 60,22 94,16
           C110,13 118,22 112,34
           C104,50 76,54 68,86
           L68,238
           L430,238
           L430,86
           L68,86"
        fill="none" stroke="#6E2A8E" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>

  <text x="90" y="200" font-family="'Fraunces', Georgia, serif" font-weight="700"
        font-style="italic" font-size="72" fill="#6E2A8E" textLength="330" lengthAdjust="spacingAndGlyphs">Lenzlinger</text>

  <text x="8" y="304" font-family="'Inter', system-ui, sans-serif" font-weight="800"
        font-size="40" letter-spacing="1" fill="#111111">Etiquettes – Etiketten</text>
</svg>
